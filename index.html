<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Bakery - Online Order Form</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: {
                            800: '#1b4332',
                            700: '#2d6a4f',
                            500: '#52b788',
                            100: '#d8f3dc',

                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }

<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

    <header class="gradient-bg text-white shadow-lg sticky top-0 z-50">

                <i class="fa-solid fa-cake-candles text-2xl text-forest-100"></i>
                <h1 class="text-xl md:text-2xl font-bold tracking-tight">Gourmet Cake Order Portal</h1>
            </div>
            <a href="admin.html" class="bg-forest-500 hover:bg-forest-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-2 shadow-md">
                <i class="fa-solid fa-user-gear"></i>
                <span>Staff Portal</span>
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8">
        <form id="orderForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
            
            <!-- Customer Information Card -->
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-forest-800 border-b border-slate-100 pb-3 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-user text-forest-500"></i> Customer & Pickup Details
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Guest Name <span class="text-red-500">*</span></label>
                        <input type="text" id="guestName" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-forest-500 focus:border-forest-500 outline-none transition" placeholder="e.g. John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Contact Phone / WhatsApp <span class="text-red-500">*</span></label>
                        <input type="tel" id="contactPhone" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-forest-500 focus:border-forest-500 outline-none transition" placeholder="e.g. +852 9123 4567">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address <span class="text-red-500">*</span></label>
                        <input type="email" id="contactEmail" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-forest-500 focus:border-forest-500 outline-none transition" placeholder="john@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Pickup Location / Hotel <span class="text-red-500">*</span></label>
                        <select id="pickupLocation" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-forest-500 focus:border-forest-500 outline-none transition bg-white">
                            <option value="">Select pickup location...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Pickup Date <span class="text-red-500">*</span></label>
                        <input type="date" id="pickupDate" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-forest-500 focus:border-forest-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Pickup Time Slot <span class="text-red-500">*</span></label>
                        <select id="pickupTime" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-forest-500 focus:border-forest-500 outline-none transition bg-white">
                            <option value="">Select pickup time...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-6">
                    <h2 class="text-lg font-bold text-forest-800 flex items-center gap-2">
                        <i class="fa-solid fa-utensils text-forest-500"></i> Menu Items Selection (45 Available)
                    </h2>
                    <span id="catalogCountBadge" class="bg-forest-100 text-forest-800 text-xs font-semibold px-2.5 py-1 rounded-full">Loading...</span>
                </div>

                <!-- Search and Filter Bar -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <input type="text" id="searchInput" oninput="renderCustomerCatalog()" placeholder="Search items by name or code..." class="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-forest-500 outline-none">
                    </div>
                    <div>
                        <select id="categoryFilter" onchange="renderCustomerCatalog()" class="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-forest-500 outline-none bg-white">
                            <option value="ALL">All Categories</option>
                            <option value="Signature Cakes">Signature Cakes</option>
                            <option value="Cheesecakes">Cheesecakes</option>
                            <option value="Tarts & Pies">Tarts & Pies</option>
                            <option value="Pastries & Bakery">Pastries & Bakery</option>
                        </select>
                    </div>
                </div>

                <div id="catalogList" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                    <!-- Dynamic Catalog Rendered Here -->
                </div>
            </div>

            <!-- Custom Wording & Remarks -->
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-forest-800 border-b border-slate-100 pb-3 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib text-forest-500"></i> Cake Wording & Special Requests
                </h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Chocolate Plaque Wording (Optional)</label>
                        <input type="text" id="cakeWording" maxlength="60" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-forest-500 outline-none" placeholder="e.g. Happy Birthday Sarah! (Max 60 chars)">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Special Instructions / Dietary Requirements</label>
                        <textarea id="remarks" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-forest-500 outline-none" placeholder="e.g. Less sweet, candle count (1 Large, 2 Small), allergy notices..."></textarea>
                    </div>
                </div>
            </div>

            <div class="bg-forest-800 text-white p-6 md:p-8 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                    <p class="text-sm text-forest-100">Total Selection</p>
                    <p id="orderSummaryText" class="text-xl font-bold text-white">0 Items selected</p>
                    <p id="orderTotalPrice" class="text-2xl font-extrabold text-forest-100 mt-1">$0 HKD</p>
                </div>

                <button type="submit" id="submitBtn" class="w-full md:w-auto bg-forest-500 hover:bg-forest-700 text-white font-bold py-3.5 px-8 rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2 text-lg">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Submit Cake Order</span>
                </button>
            </div>
        </form>
    </main>

            { id: "P05", code: "P05", name: "Almond Cream Croissant Box (4 pcs)", price: 130, category: "Pastries & Bakery", description: "Twice-baked croissant topped with toasted sliced almonds" },
            { id: "P06", code: "P06", name: "Cinnamon Roll Box (4 pcs)", price: 100, category: "Pastries & Bakery", description: "Soft cinnamon brioche rolls with cream cheese frosting" },
            { id: "P07", code: "P07", name: "Mini Fruit Danish Assortment (8 pcs)", price: 150, category: "Pastries & Bakery", description: "Mini flaky pastries topped with berries and custard" },
            { id: "P08", code: "P08", name: "Dark Chocolate Brownie Slice Box (4 pcs)", price: 115, category: "Pastries & Bakery", description: "Fudgy Belgian dark chocolate walnut brownies" },
            { id: "P09", code: "P09", name: "Scones with Clotted Cream & Jam (4 pcs)", price: 120, category: "Pastries & Bakery", description: "Classic English buttery scones with Devonshire cream" },
            { id: "P10", code: "P10", name: "Pistachio Croissant Roll (3 pcs)", price: 140, category: "Pastries & Bakery", description: "New York style circular croissant filled with pistachio cream" },
            { id: "P11", code: "P11", name: "Tiramisu Choux Cream Puff (4 pcs)", price: 125, category: "Pastries & Bakery", description: "Crispy choux filled with mascarpone espresso cream" },
            { id: "P12", code: "P12", name: "Matcha Latte Craquelin Choux (4 pcs)", price: 120, category: "Pastries & Bakery", description: "Green tea craquelin puff with matcha cream" }
        ];

        // Firebase Config Setup
        const firebaseConfig = {
            databaseURL: "https://cakeorderapp-default-rtdb.firebaseio.com/" 
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentCatalog = [...DEFAULT_CATALOG];
        let selectedQuantities = {};

        // Auto Sync/Seed database with 45 items if empty or incomplete
        function initializeCatalog() {
            db.ref('cake_catalog').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && Object.keys(data).length >= 45) {
                    currentCatalog = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                } else {
                    // Seed database
                    const updates = {};
                    DEFAULT_CATALOG.forEach(item => {
                        updates['cake_catalog/' + item.id] = item;
                    });
                    db.ref().update(updates);
                    currentCatalog = [...DEFAULT_CATALOG];
                }
                renderCustomerCatalog();
            });

            // Load Pickup Settings
            db.ref('settings/pickup').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    populatePickupDropdowns(data.locations || [], data.timeslots || []);
                } else {
                    populatePickupDropdowns(
                        ["Central Flagship Store", "Kowloon TST Branch", "Shatin Hotel Lobby"],
                        ["11:00 AM - 01:00 PM", "01:00 PM - 04:00 PM", "04:00 PM - 07:00 PM"]
                    );
                }
            });
        }

        function populatePickupDropdowns(locations, timeslots) {
            const locSelect = document.getElementById('pickupLocation');
            const timeSelect = document.getElementById('pickupTime');

            locSelect.innerHTML = '<option value="">Select pickup location...</option>' + 
                locations.map(loc => `<option value="${loc}">${loc}</option>`).join('');

            timeSelect.innerHTML = '<option value="">Select pickup time...</option>' + 
                timeslots.map(t => `<option value="${t}">${t}</option>`).join('');
        }

        function renderCustomerCatalog() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const container = document.getElementById('catalogList');

            const filtered = currentCatalog.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search) || item.code.toLowerCase().includes(search);
                const matchesCat = category === 'ALL' || item.category === category;
                return matchesSearch && matchesCat;
            });

            document.getElementById('catalogCountBadge').innerText = `${filtered.length} Items Displayed`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400">No matching cake items found.</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const qty = selectedQuantities[item.id] || 0;
                return `
                    <div class="p-4 rounded-xl border border-slate-200 hover:border-forest-500 transition flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white">
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <span class="bg-forest-100 text-forest-800 text-xs px-2 py-0.5 rounded font-mono font-bold">${item.code}</span>
                                <h3 class="font-bold text-slate-800">${item.name}</h3>
                            </div>
                            <p class="text-xs text-slate-500 mt-1">${item.description || 'Delicately crafted gourmet specialty.'}</p>
                            <p class="text-forest-700 font-bold mt-2">$${item.price} HKD</p>
                        </div>
                        <div class="flex items-center space-x-3 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                            <button type="button" onclick="updateQty('${item.id}', -1)" class="w-8 h-8 rounded-lg bg-white shadow-sm flex items-center justify-center font-bold text-slate-700 hover:bg-slate-200">-</button>
                            <span class="w-8 text-center font-bold text-slate-800" id="qty-${item.id}">${qty}</span>
                            <button type="button" onclick="updateQty('${item.id}', 1)" class="w-8 h-8 rounded-lg bg-forest-500 text-white shadow-sm flex items-center justify-center font-bold hover:bg-forest-700">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            calculateTotals();
        }

        function updateQty(itemId, delta) {
            const current = selectedQuantities[itemId] || 0;
            const updated = Math.max(0, current + delta);
            if (updated === 0) {
                delete selectedQuantities[itemId];
            } else {
                selectedQuantities[itemId] = updated;
            }
            const el = document.getElementById(`qty-${itemId}`);
            if (el) el.innerText = updated;
            calculateTotals();
        }

        function calculateTotals() {
            let count = 0;
            let total = 0;

            Object.keys(selectedQuantities).forEach(id => {
                const item = currentCatalog.find(c => c.id === id);
                if (item) {
                    const q = selectedQuantities[id];
                    count += q;
                    total += (item.price * q);
                }
            });

            document.getElementById('orderSummaryText').innerText = `${count} Total Items Selected`;
            document.getElementById('orderTotalPrice').innerText = `$${total.toLocaleString()} HKD`;
        }

        // Generate Order Ref ID: YYYYMMDD001...
        async function generateRefNo() {
            const now = new Date();
            const datePrefix = now.getFullYear().toString() +
                String(now.getMonth() + 1).padStart(2, '0') +
                String(now.getDate()).padStart(2, '0');

            const refCounterRef = db.ref(`order_counters/${datePrefix}`);
            const result = await refCounterRef.transaction((currentValue) => {
                return (currentValue || 0) + 1;
            });

            const count = result.snapshot.val();
            const sequenceStr = String(count).padStart(3, '0');
            return `${datePrefix}${sequenceStr}`;
        }

        // Form Submission Handler
        async function handleFormSubmit(e) {
            e.preventDefault();

            const selectedItemsArray = [];
            Object.keys(selectedQuantities).forEach(id => {
                const item = currentCatalog.find(c => c.id === id);
                if (item && selectedQuantities[id] > 0) {
                    selectedItemsArray.push({
                        id: item.id,
                        code: item.code,
                        name: item.name,
                        price: item.price,
                        quantity: selectedQuantities[id],
                        subtotal: item.price * selectedQuantities[id]
                    });
                }
            });

            if (selectedItemsArray.length === 0) {
                alert("Please select at least one cake item to place an order.");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Submitting Order...`;

            try {
                const refNo = await generateRefNo();
                const now = new Date();
                const formattedTimestamp = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                let grandTotal = 0;
                selectedItemsArray.forEach(i => grandTotal += i.subtotal);

                const newOrder = {
                    refNo: refNo,
                    guestName: document.getElementById('guestName').value.trim(),
                    contactPhone: document.getElementById('contactPhone').value.trim(),
                    contactEmail: document.getElementById('contactEmail').value.trim(),
                    pickupLocation: document.getElementById('pickupLocation').value,
                    pickupDate: document.getElementById('pickupDate').value,
                    pickupTime: document.getElementById('pickupTime').value,
                    cakeWording: document.getElementById('cakeWording').value.trim(),
                    remarks: document.getElementById('remarks').value.trim(),
                    items: selectedItemsArray,
                    totalAmount: grandTotal,
                    status: "Pending",
                    handlingStaff: "Self-Service",
                    createdAt: formattedTimestamp,
                    updatedAt: formattedTimestamp
                };

                await db.ref('orders/' + refNo).set(newOrder);

                alert(`Order Submitted Successfully!\nYour Reference No is: ${refNo}`);
                document.getElementById('orderForm').reset();
                selectedQuantities = {};
                renderCustomerCatalog();
            } catch (err) {
                console.error("Order submission error:", err);
                alert("An error occurred while submitting your order. Please try again.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Submit Cake Order</span>`;
            }
        }

        window.onload = function() {
            initializeCatalog();
        };
    </script>
</body>
</html>
